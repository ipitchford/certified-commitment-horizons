name: verify candidate package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install replay dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps release/wwprefix-3.0.0-py3-none-any.whl
      - name: Parse sources
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m compileall -q src scripts tests
      - name: Test normally
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python -m pytest -q -p no:cacheprovider
      - name: Test with assertions disabled
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python -O -m pytest -q -p no:cacheprovider
      - name: Verify frozen release tree and final receipt
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          release_tree=$(mktemp -d)
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='archive/' \
            --exclude='editorial/' \
            --exclude='CONTRIBUTING.md' \
            ./ "$release_tree/"
          python "$release_tree/scripts/verify_hashes.py" "$release_tree/release/SHA256SUMS"
          cd "$release_tree"
          PYTHONPATH=src python scripts/verify_release.py --run-tests
