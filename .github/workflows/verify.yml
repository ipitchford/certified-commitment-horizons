name: verify candidate package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install replay dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps release/wwprefix-2.1.2-py3-none-any.whl
      - name: Parse sources
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/check_python_syntax.py
      - name: Test normally
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python -m pytest -q -p no:cacheprovider
      - name: Test with assertions disabled
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python -O -m pytest -q -p no:cacheprovider
      - name: Verify frozen artefacts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python scripts/verify_release.py --run-tests
