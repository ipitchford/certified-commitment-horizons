[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wwprefix"
version = "2.1.2"
description = "Certified commitment horizons for Wagner-Whitin dynamic lot sizing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Anonymous agentic research workflow"}]
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.0",
  "pandas==2.2.3",
  "matplotlib==3.10.8",
  "typer==0.26.3",
]

[project.scripts]
wwprefix = "wwprefix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = ["pytest==9.0.2"]
