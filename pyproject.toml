[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wwprefix"
version = "3.0.0"
description = "Exact prefix stability and certified commitment horizons for Wagner-Whitin dynamic lot sizing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Anonymous"}]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "typer>=0.12",
]

[project.scripts]
wwprefix = "wwprefix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
